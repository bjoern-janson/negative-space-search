name: v0.1 checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Run hostile benchmark tests
        run: python -m unittest discover -s tests -v
      - name: Execute v0.1 benchmark
        run: python -m negative_space_search.run_v0_1
